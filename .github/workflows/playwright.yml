name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      env:
          VALID_EMAIL1: ${{ secrets.VALID_EMAIL1}}
          VALID_PASSWORD1: ${{ secrets.VALID_PASSWORD1}}
          VALID_EMAIL2: ${{ secrets.VALID_EMAIL2}}
          VALID_PASSWORD2: ${{ secrets.VALID_PASSWORD2}}
          INVALID_EMAIL: ${{ secrets.INVALID_EMAIL }}
          INVALID_PASSWORD: ${{ secrets.INVALID_PASSWORD }}
          WRONG_PASSWORD: ${{ secrets.WRONG_PASSWORD }}
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
